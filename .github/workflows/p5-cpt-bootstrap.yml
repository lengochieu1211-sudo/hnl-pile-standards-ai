name: P5 CPT Bootstrap Patch

on:
  push:
    branches:
      - p5/cpt-promotion-hardening

permissions:
  contents: write

jobs:
  apply-cpt-patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply CPT CT29 router integration') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: p5/cpt-promotion-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply deterministic CT29 patch
        run: node scripts/p5-apply-cpt-router-patch.mjs

      - name: Focused CPT Golden
        run: node --test tests/p5-cpt-promotion.test.mjs

      - name: Existing full regression
        run: npm test

      - name: Remove bootstrap helpers and commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/p5-cpt-bootstrap.yml scripts/p5-apply-cpt-router-patch.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engineering-router.js src/production-status-registry.js tests/p5-cpt-promotion.test.mjs
          git add -u .github/workflows/p5-cpt-bootstrap.yml scripts/p5-apply-cpt-router-patch.mjs
          git diff --cached --check
          git commit -m "feat(p5.2): apply CPT CT29 router integration"
          git push origin HEAD:p5/cpt-promotion-hardening
