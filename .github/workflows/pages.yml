name: Deploy HNL Web v1.27.0 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Single-version identity gate
        run: npm run check:version
      - name: Release synchronization gate
        run: npm run gate:release-sync
      - name: Test core logic
        run: npm test
      - name: Full Table Golden
        run: npm run golden:tables
      - name: ExcelJS runtime smoke
        run: npm run excel:smoke
      - name: Excel Production smoke
        run: npm run excel:production-smoke
      - name: Master Audit · P0 must be closed before deploy
        run: node scripts/master-system-audit.mjs --enforce-p0
      - name: Build HNL Web
        run: npm run build:web
      - name: Show build metadata
        run: cat dist/build-info.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
