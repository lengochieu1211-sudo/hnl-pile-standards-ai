name: Build HNL Desktop AI v1.26.0 for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags: ['v1.26.0']

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Read app version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          if ($version -ne '1.26.0') { throw "Expected v1.26.0, got $version" }
      - name: Validate Windows packaging contract
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $targetMacro = '$' + '{target}'
          $setupName = [string]$pkg.build.nsis.artifactName
          $portableName = [string]$pkg.build.portable.artifactName
          if ($setupName.Contains($targetMacro) -or $portableName.Contains($targetMacro)) {
            throw "Unsupported target macro in Windows artifactName"
          }
          if ($setupName -notmatch '^HNL-Pile-Standards-AI-Setup-\$\{version\}-\$\{arch\}\.\$\{ext\}$') {
            throw "Unexpected NSIS artifactName: $setupName"
          }
          if ($portableName -notmatch '^HNL-Pile-Standards-AI-Portable-\$\{version\}-\$\{arch\}\.\$\{ext\}$') {
            throw "Unexpected Portable artifactName: $portableName"
          }
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Single-version identity gate
        run: npm run check:version
      - name: Release synchronization gate
        run: npm run gate:release-sync
      - name: Test core logic
        run: npm test
      - name: Full Table Golden
        run: npm run golden:tables
      - name: ExcelJS runtime smoke
        run: npm run excel:smoke
      - name: Excel Production smoke
        run: npm run excel:production-smoke
      - name: Master Audit · P0 must be closed before EXE
        run: node scripts/master-system-audit.mjs --enforce-p0
      - name: Build NSIS and Portable EXE
        run: npm run dist:win
      - name: Verify Windows EXEs
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter "HNL-Pile-Standards-AI-Setup-1.26.0-*.exe" -File
          $portable = Get-ChildItem release -Filter "HNL-Pile-Standards-AI-Portable-1.26.0-*.exe" -File
          if ($setup.Count -lt 1) { throw "Không tìm thấy Setup v1.26.0" }
          if ($portable.Count -lt 1) { throw "Không tìm thấy Portable v1.26.0" }
      - name: Smoke test Portable EXE
        shell: pwsh
        run: |
          $portable = Get-ChildItem release -Filter "HNL-Pile-Standards-AI-Portable-1.26.0-*.exe" -File | Select-Object -First 1
          $process = Start-Process -FilePath $portable.FullName -ArgumentList "--smoke-test" -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) { try { Stop-Process -Id $process.Id -Force } catch {}; throw "Portable smoke timeout" }
          if ($process.ExitCode -ne 0) { throw "Portable smoke FAIL: $($process.ExitCode)" }
      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HNL-Pile-Standards-AI-Windows-v1.26.0-build-${{ github.run_number }}
          path: |
            release/HNL-Pile-Standards-AI-Setup-*.exe
            release/HNL-Pile-Standards-AI-Portable-*.exe
            artifacts/master-system-audit/**
          if-no-files-found: error
          retention-days: 14
