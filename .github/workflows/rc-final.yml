name: HNL v1.27.0 RC Final Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  linux-gate:
    name: Linux · Full Golden + Master Audit promotion gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          clean: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Single-version identity gate
        run: npm run check:version
      - name: Release synchronization gate
        run: npm run gate:release-sync
      - name: Source sync gate
        run: npm run gate:pass83-source-sync
      - name: Browser / Node boundary gate
        run: npm run gate:pass83-web-boundary
      - name: Exact 574 regression
        run: npm run gate:pass83-tests
      - name: Full Table Golden
        run: npm run golden:tables
      - name: Workflow Golden
        run: npm run golden:workflows
      - name: Material Golden
        run: npm run golden:material
      - name: Material E2E Golden
        run: npm run golden:material-e2e
      - name: DCE UDF Behavioral Golden
        run: npm run golden:dce-udf
      - name: SPT PDF Decision Golden
        run: npm run golden:spt-decision
      - name: Multi-Borehole Golden
        run: npm run golden:multiborehole
      - name: ExcelJS runtime smoke
        run: npm run excel:smoke
      - name: Excel Production smoke
        run: npm run excel:production-smoke
      - name: Master System Audit · RC requires all open gaps closed
        run: node scripts/master-system-audit.mjs --enforce-all
      - name: Build Web
        run: npm run build:web
      - name: Verify v1.27.0 build metadata
        run: node -e "const x=require('./dist/build-info.json'); if(x.version!=='1.27.0'||x.certificationStage!=='MASTER_SYSTEM_AUDIT'||x.goldenBaseline!=='1.25.7'||'engineeringRelease' in x) throw new Error(JSON.stringify(x));"
      - uses: actions/upload-artifact@v4
        with:
          name: hnl-v1.27.0-web-golden-excel
          path: |
            dist/**
            public/release-meta.json
            artifacts/master-system-audit/**
            artifacts/full-table-golden-v1.25.7.json
            artifacts/p0-pass3/workflow-golden-v1.25.7.json
            artifacts/p1-pass1/material-golden-v1.25.7.json
            artifacts/p1-material-e2e/material-e2e-golden-v1.25.7.json
            artifacts/dce-udf-behavioral/**
            artifacts/spt-pdf-decision/**
            artifacts/p1-multiborehole/**
            artifacts/excel-runtime-smoke/**
            package-lock.json

  windows-gate:
    name: Windows · Setup + Portable + Excel + Master Audit
    needs: linux-gate
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          clean: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Single-version identity gate
        run: npm run check:version
      - name: Release synchronization gate
        run: npm run gate:release-sync
      - name: Exact 574 regression
        run: npm run gate:pass83-tests
      - name: Full Table Golden
        run: npm run golden:tables
      - name: Workflow Golden
        run: npm run golden:workflows
      - name: Material Golden
        run: npm run golden:material
      - name: Material E2E Golden
        run: npm run golden:material-e2e
      - name: DCE UDF Behavioral Golden
        run: npm run golden:dce-udf
      - name: SPT PDF Decision Golden
        run: npm run golden:spt-decision
      - name: Multi-Borehole Golden
        run: npm run golden:multiborehole
      - name: ExcelJS runtime smoke
        run: npm run excel:smoke
      - name: Excel Production smoke
        run: npm run excel:production-smoke
      - name: Master System Audit · RC requires all open gaps closed
        run: node scripts/master-system-audit.mjs --enforce-all
      - name: Build Setup + Portable EXE
        run: npm run dist:win
      - name: Verify v1.27.0 Windows artifacts
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -File -Recurse | Where-Object { $_.Name -like 'HNL-Pile-Standards-AI-Setup-1.27.0-*.exe' }
          $portable = Get-ChildItem release -File -Recurse | Where-Object { $_.Name -like 'HNL-Pile-Standards-AI-Portable-1.27.0-*.exe' }
          if (($setup | Measure-Object).Count -lt 1) { throw 'Missing Setup v1.27.0' }
          if (($portable | Measure-Object).Count -lt 1) { throw 'Missing Portable v1.27.0' }
      - name: Microsoft Excel COM recalculation when available
        id: excelcom
        shell: pwsh
        continue-on-error: true
        run: ./scripts/verify-excel-com.ps1 -Dir artifacts/excel-runtime-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: hnl-v1.27.0-windows-setup-portable-excel
          path: |
            release/*.exe
            public/release-meta.json
            artifacts/master-system-audit/**
            artifacts/excel-runtime-smoke/**
            scripts/verify-excel-com.ps1
