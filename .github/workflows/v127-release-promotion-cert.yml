name: HNL v1.27.0 Release Promotion Certification
on:
  push:
    branches: [repair/v127-excel-compat-release]
    paths:
      - scripts/apply-v127-release-promotion.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  certify-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Apply controlled v1.27.0 promotion
        run: node scripts/apply-v127-release-promotion.mjs
      - name: Version + Search Brain identity
        run: |
          npm run check:version
          npm run check:search
          node -e "const m=require('./public/release-meta.json'); if(m.appVersion!=='1.27.0'||m.goldenBaseline!=='1.25.7'||m.searchBrain!=='1.9.23'||m.searchBrainStatus!=='LOCKED') throw new Error(JSON.stringify(m));"
          node -e "const fs=require('fs');const s=fs.readFileSync('src/p4-pdf-excel-intelligence.js','utf8');if(!s.includes(\"P4_PROMOTION_STATE = 'SHADOW_ONLY'\"))throw new Error('P4 safety drift');"
      - name: Release/source synchronization
        run: |
          npm run gate:release-sync
          npm run gate:pass83-source-sync
          npm run gate:pass83-tests
      - name: Master Audit enforce all
        run: node scripts/master-system-audit.mjs --enforce-all
      - name: Full regression
        run: npm test
      - name: Full Table Golden
        run: npm run golden:tables
      - name: Workflow Golden
        run: npm run golden:workflows
      - name: Material Golden
        run: npm run golden:material
      - name: DCE UDF Golden
        run: npm run golden:dce-udf
      - name: SPT Decision Golden
        run: npm run golden:spt-decision
      - name: Material E2E Golden
        run: npm run golden:material-e2e
      - name: Multi-Borehole Golden
        run: npm run golden:multiborehole
      - name: Excel runtime + Production smoke
        run: |
          npm run excel:smoke
          npm run excel:production-smoke
      - name: Build v1.27.0 Web
        run: |
          npm run build:web
          node -e "const x=require('./dist/build-info.json');if(x.version!=='1.27.0'||x.goldenBaseline!=='1.25.7'||x.searchBrain!=='1.9.23'||x.searchBrainStatus!=='LOCKED')throw new Error(JSON.stringify(x));"
      - name: Active-version stale-reference gate
        shell: bash
        run: |
          for f in package.json package-lock.json public/release-meta.json README.md docs/BUILD_METADATA.md scripts/check-version-sync.mjs scripts/excel-production-smoke.mjs scripts/master-system-audit.mjs tools/release-sync-gate.mjs .github/workflows/desktop-win.yml .github/workflows/master-system-audit.yml .github/workflows/pages.yml .github/workflows/pass83-runtime-cert.yml .github/workflows/rc-final.yml .github/workflows/v26-spt-input-cert.yml; do
            if grep -q '1\.26\.0' "$f"; then echo "STALE ACTIVE VERSION: $f"; grep -n '1\.26\.0' "$f"; exit 1; fi
          done
          test -f docs/RELEASE_V1.27.0.md
          grep -q 'SHADOW_ONLY' docs/RELEASE_V1.27.0.md
      - name: Ensure promotion does not mutate workflow files
        shell: bash
        run: |
          if ! git diff --quiet -- .github/workflows; then
            echo 'Promotion script must not mutate .github/workflows files.'
            git diff -- .github/workflows
            exit 1
          fi
      - name: Commit only certified v1.27.0 release files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            00_HUONG_DAN_DAN_DE.md FULL_OVERWRITE_INFO.txt FULL_OVERWRITE_MANIFEST.json \
            MASTER_AUDIT_PLAN.md MASTER_AUDIT_PREFLIGHT.json MASTER_AUDIT_PRELIMINARY_GAP_MATRIX.md \
            README.md RELEASE_SYNC_MANIFEST.json UPDATE_INFO.txt docs/BUILD_METADATA.md docs/RELEASE_V1.27.0.md \
            package.json package-lock.json public/changelog.json public/release-meta.json \
            scripts/check-version-sync.mjs scripts/excel-production-smoke.mjs scripts/master-system-audit.mjs \
            src/excel-export-compat.js tools/release-sync-gate.mjs vite.config.js
          if git diff --cached --quiet; then echo 'No v1.27.0 release diff'; exit 1; fi
          git commit -m "release: promote HNL Pile Standards AI v1.27.0"
          git push origin HEAD:repair/v127-excel-compat-release
