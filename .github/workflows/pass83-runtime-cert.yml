name: P1 Pass 8.3 Runtime Certification

on:
  workflow_dispatch:
  push:
    branches:
      - 'p1/pass8.3-runtime-cert-v21'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-certification:
    name: Linux · npm ci + 574 tests + Golden + Vite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Locked regression suite
        run: npm test

      - name: Full Table Golden 1242
        run: npm run golden:tables

      - name: Workflow Golden 35
        run: npm run golden:workflows

      - name: Material Golden
        run: npm run golden:material

      - name: DCE UDF Golden 213
        run: npm run golden:dce-udf

      - name: SPT decision Golden 26
        run: npm run golden:spt-decision

      - name: Material E2E Golden
        run: npm run golden:material-e2e

      - name: Multi-borehole Golden
        run: npm run golden:multiborehole

      - name: Pass 8.2 production UI E2E
        run: node --test tests/p1-pass82-full-app-ui-e2e.test.mjs

      - name: Build production web with Vite
        run: npm run build:web

      - name: Upload web build and gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass83-web-v21
          path: |
            dist/**
            artifacts/P1_PASS8_2_FULL_SOURCE_PRODUCTION_UI_E2E_GATE_V21.json
          if-no-files-found: warn

  windows-certification:
    name: Windows · npm ci + tests + EXE
    needs: linux-certification
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Locked regression suite on Windows
        run: npm test

      - name: Build desktop UI
        run: npm run build:desktop

      - name: Build NSIS + Portable
        run: npx electron-builder --win nsis portable --publish never

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File -Recurse | Where-Object { $_.Extension -eq '.exe' }
          $files | Format-Table FullName, Length
          if (($files | Measure-Object).Count -lt 2) { throw 'Expected NSIS and Portable EXE artifacts.' }

      - name: Upload Windows runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pass83-windows-v21
          path: release/**/*.exe
          if-no-files-found: error
