name: Deploy HNL Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync package-lock with app version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -e "try{process.stdout.write(require('./package-lock.json').version||'')}catch(e){}")
          if [ ! -f package-lock.json ] || [ "$LOCK_VERSION" != "$PKG_VERSION" ]; then
            echo "Tạo/cập nhật lock tạm: v${LOCK_VERSION:-missing} → v$PKG_VERSION"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          test -f package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Version Gate
        run: npm run check:version

      - name: Test core logic
        run: npm test

      - name: Full Table Golden
        run: npm run golden:tables

      - name: ExcelJS runtime smoke
        run: npm run excel:smoke

      - name: Build HNL Web
        run: npm run build:web

      - name: Show build metadata
        run: cat dist/build-info.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
