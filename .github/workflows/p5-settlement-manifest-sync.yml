name: P5.5 Settlement Manifest Sync

on:
  push:
    branches: [p5/settlement-promotion]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: p5/settlement-promotion
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Update release manifest hashes
        run: node scripts/p5-settlement-manifest-sync.mjs
      - name: Commit manifest when changed
        shell: bash
        run: |
          if git diff --quiet -- RELEASE_SYNC_MANIFEST.json; then
            echo 'Manifest already synced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_SYNC_MANIFEST.json
          git commit -m 'chore(p5.5): sync settlement release fingerprints'
          git push origin HEAD:p5/settlement-promotion
