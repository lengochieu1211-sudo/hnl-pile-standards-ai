name: Excel P1 Dropdown Runtime Localization Repair

on:
  push:
    branches:
      - repair/post-merge-excel-audit-p1
    paths:
      - scripts/repair-excel-p1-dropdown.mjs
      - .github/workflows/excel-p1-dropdown-repair.yml

permissions:
  contents: write

jobs:
  repair-and-certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Apply deterministic dropdown runtime-localization patch
        run: node scripts/repair-excel-p1-dropdown.mjs
      - name: Syntax and immutable Search Brain
        run: |
          node --check src/excel-export-compat.js
          node --check scripts/master-system-audit.mjs
          node --check scripts/excel-production-smoke.mjs
          npm run check:search
      - name: Master Audit dropdown proof
        shell: bash
        run: |
          node scripts/master-system-audit.mjs --enforce-p0
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('artifacts/master-system-audit/HNL_MASTER_CERTIFICATION_v1.26.0.json','utf8'));
          for(const id of ['EXCEL:SHEET_LANGUAGE','EXCEL:DROPDOWN_INTERNAL_CODE']){
            const row=j.gaps.find(x=>x.id===id);
            if(!row || row.status!=='PASS') throw new Error(`${id} not PASS: ${JSON.stringify(row)}`);
          }
          if(j.summary.openP0!==0) throw new Error(`Unexpected P0: ${JSON.stringify(j.summary)}`);
          console.log('P1 UI GATES PASS',j.summary);
          NODE
      - name: Full regression
        run: npm test
      - name: Full Table Golden
        run: npm run golden:tables
      - name: Workflow Golden
        run: npm run golden:workflows
      - name: Material Golden
        run: npm run golden:material
      - name: DCE UDF Behavioral Golden
        run: npm run golden:dce-udf
      - name: SPT PDF Decision Golden
        run: npm run golden:spt-decision
      - name: Material E2E Golden
        run: npm run golden:material-e2e
      - name: Multi-Borehole Golden
        run: npm run golden:multiborehole
      - name: Excel runtime smoke
        run: npm run excel:smoke
      - name: Excel production smoke
        run: npm run excel:production-smoke
      - name: Build Web
        run: npm run build:web
      - name: Locked source and release gates
        run: |
          npm run gate:pass83-source-sync
          npm run gate:pass83-tests
          npm run gate:release-sync
      - name: Commit only certified dropdown repair files
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/excel-export-compat.js scripts/master-system-audit.mjs scripts/excel-production-smoke.mjs
          if git diff --cached --quiet; then
            echo "No certified dropdown repair changes to commit."
            exit 0
          fi
          git commit -m "fix(excel-p1): localize internal-code dropdowns at runtime"
          git push origin HEAD:repair/post-merge-excel-audit-p1
