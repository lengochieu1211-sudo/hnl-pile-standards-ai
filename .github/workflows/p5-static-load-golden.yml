name: P5 Static Load Promotion Golden
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, 'p5/static-load-promotion' ]
jobs:
  static-load-promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version identity
        run: npm run check:version
      - name: Search Brain lock
        run: npm run check:search
      - name: Static load CT20-21 focused Golden
        run: node --test tests/p5-static-load-promotion.test.mjs
      - name: Exact additive test-count gate
        run: npm run gate:pass83-tests
      - name: Full regression suite
        run: npm test
