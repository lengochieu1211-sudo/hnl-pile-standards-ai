name: P5 Calculation Coverage Audit

on:
  push:
    branches:
      - audit/p5-full-calculation-gap-20260905
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p5-coverage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Version identity
        run: npm run check:version

      - name: Search Brain lock
        run: npm run check:search

      - name: P5 calculation coverage gate
        run: node scripts/p5-calculation-coverage-audit.mjs --enforce-existing

      - name: Existing regression suite
        run: npm test

      - name: Upload P5 coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HNL-P5-Calculation-Coverage-${{ github.sha }}
          path: artifacts/p5-calculation-coverage/
          if-no-files-found: error
          retention-days: 30
