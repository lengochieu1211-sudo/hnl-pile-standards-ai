name: v1.27 Excel Compatibility Inventory
on:
  push:
    branches: [repair/v127-excel-compat-release]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inventory modern Excel formulas
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='src/excel-export.js';
          const lines=fs.readFileSync(p,'utf8').split(/\r?\n/);
          const tokens=['LET','XLOOKUP','LAMBDA','SWITCH','IFS'];
          const out={};
          for(const t of tokens){
            const re=new RegExp('\\b'+t+'\\s*\\(','g');
            const hits=[];
            lines.forEach((line,i)=>{const n=(line.match(re)||[]).length;if(n)hits.push({line:i+1,count:n,text:line.trim()});});
            out[t]={count:hits.reduce((a,b)=>a+b.count,0),hits};
          }
          console.log(JSON.stringify(out,null,2));
          fs.mkdirSync('artifacts/v127-excel-compat',{recursive:true});
          fs.writeFileSync('artifacts/v127-excel-compat/FORMULA_INVENTORY.json',JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v127-excel-compat-inventory
          path: artifacts/v127-excel-compat/FORMULA_INVENTORY.json
