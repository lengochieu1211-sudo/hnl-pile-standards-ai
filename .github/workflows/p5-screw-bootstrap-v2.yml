name: P5.6 Screw Pile Bootstrap v2

on:
  push:
    branches: [p5/screw-pile-promotion]

permissions:
  contents: write

jobs:
  patch-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: p5/screw-pile-promotion
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Reuse P5.6 patch with legacy manual compatibility
        shell: python
        run: |
          from pathlib import Path
          y=Path('.github/workflows/p5-screw-bootstrap.yml').read_text(encoding='utf-8')
          start=y.index('        run: |\n',y.index('Patch deterministic CT17-19 screw workflow'))+len('        run: |\n')
          end=y.index('      - name: Install locked dependencies',start)
          lines=y[start:end].splitlines()
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          old="if(!clay&&!sand) missing.push('Loại đất vùng làm việc: đất sét/sét pha hoặc cát/cát pha để kiểm Chú thích 2.');"
          new="if(!clay&&!sand && !(manualA1!=null&&manualA2!=null&&manualGammaC!=null)) missing.push('Loại đất vùng làm việc: đất sét/sét pha hoặc cát/cát pha để kiểm Chú thích 2.');"
          if old not in code:
            raise SystemExit('legacy compatibility anchor missing')
          code=code.replace(old,new,1)
          exec(compile(code,'p5-screw-reused-bootstrap','exec'),{'__name__':'__main__'})
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Focused P5.6 Golden
        run: node --test tests/p5-screw-pile-promotion.test.mjs
      - name: Exact additive count 644
        run: node tools/pass83-test-count-gate.mjs
      - name: Full regression
        run: npm test
      - name: Commit certified P5.6 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engineering-router.js src/production-status-registry.js tools/pass83-test-count-gate.mjs tests/p5-screw-pile-promotion.test.mjs docs/P5_6_SCREW_PILE_PROMOTION_EVIDENCE.md
          git diff --cached --quiet && exit 0
          git commit -m "feat(p5.6): certify screw pile CT17-19 tables 9-10"
          git push origin HEAD:p5/screw-pile-promotion
