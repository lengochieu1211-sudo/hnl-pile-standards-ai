name: HNL v1.25.6 RC Final Gate

on:
  push:
    branches:
      - main
      - release/v1.25.6-rc
  workflow_dispatch:

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  bootstrap-lock:
    name: Bootstrap and persist package-lock
    runs-on: ubuntu-latest
    outputs:
      lock_created: ${{ steps.lock.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: lock
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -e "try{process.stdout.write(require('./package-lock.json').version||'')}catch(e){}")
          if [ -f package-lock.json ] && [ "$LOCK_VERSION" = "$PKG_VERSION" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "package-lock.json đã đồng bộ v$PKG_VERSION."
            exit 0
          fi
          echo "Tạo/cập nhật package-lock.json: lock=v${LOCK_VERSION:-missing} → package=v$PKG_VERSION"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -f package-lock.json
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(l.version!==p.version) throw new Error('package-lock version mismatch')"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Commit package-lock back to current branch
        if: steps.lock.outputs.created == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: sync package-lock for HNL v1.25.6 RC"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  linux-gate:
    name: Clean checkout → npm ci → 286 tests → 1,130 Golden → ExcelJS → Web
    needs: bootstrap-lock
    if: needs.bootstrap-lock.outputs.lock_created == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Version Gate + regression
        run: npm test

      - name: Full Table Golden
        run: npm run golden:tables

      - name: ExcelJS runtime smoke
        run: npm run excel:smoke

      - name: Build Web
        run: npm run build:web

      - uses: actions/upload-artifact@v4
        with:
          name: hnl-v1.25.6-web-golden-excel
          path: |
            dist/**
            artifacts/full-table-golden-v1.25.6.json
            artifacts/excel-runtime-smoke/**
            package-lock.json

  windows-gate:
    name: Windows Setup + Portable + ExcelJS runtime
    needs: linux-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Regression tests
        run: npm test

      - name: Full Table Golden
        run: npm run golden:tables

      - name: ExcelJS runtime smoke
        run: npm run excel:smoke

      - name: Build Setup + Portable EXE
        run: npm run dist:win

      - name: Microsoft Excel COM recalculation when available
        id: excelcom
        shell: pwsh
        continue-on-error: true
        run: ./scripts/verify-excel-com.ps1 -Dir artifacts/excel-runtime-smoke

      - name: Record Excel COM availability
        shell: pwsh
        run: |
          $status = "${{ steps.excelcom.outcome }}"
          "Microsoft Excel COM step: $status" | Set-Content -Encoding UTF8 artifacts/excel-runtime-smoke/excel-com-status.txt
          if ($status -ne "success") {
            Write-Host "GitHub-hosted Windows runner không bảo đảm có Microsoft Excel; cần kiểm cuối trên máy Windows có Excel."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: hnl-v1.25.6-windows-setup-portable-excel
          path: |
            release/*.exe
            artifacts/full-table-golden-v1.25.6.json
            artifacts/excel-runtime-smoke/**
            scripts/verify-excel-com.ps1
