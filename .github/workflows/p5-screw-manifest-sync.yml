name: P5.6 Screw Manifest Sync

on:
  push:
    branches: [p5/screw-pile-promotion]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: p5/screw-pile-promotion
          fetch-depth: 0
      - name: Sync source and release fingerprints from exact bytes
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, re

          def raw_hash(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def norm_hash(path):
              s=Path(path).read_text(encoding='utf-8').replace('\r\n','\n')
              return hashlib.sha256(s.encode('utf-8')).hexdigest()

          # 1) Source-sync gate uses raw bytes.
          p=Path('tools/pass83-source-sync-gate.mjs')
          s=p.read_text(encoding='utf-8')
          router=raw_hash('src/engineering-router.js')
          s=re.sub(r"('src/engineering-router\.js':'?)[0-9a-f]{64}('?)", lambda m:m.group(1)+router+m.group(2), s, count=1)
          s=s.replace('refreshed through P5.3 static-load promotion','refreshed through P5.6 screw-pile promotion')
          s=s.replace('P5.3 static-load-certified integration source synchronized','P5.6 screw-pile-certified integration source synchronized')
          p.write_text(s,encoding='utf-8',newline='\n')

          # 2) Release manifest uses normalized text hashes.
          tracked=[
            'src/engineering-router.js',
            'src/production-status-registry.js',
            'tools/pass83-test-count-gate.mjs',
            'tools/pass83-source-sync-gate.mjs',
            'tests/p5-screw-pile-promotion.test.mjs',
            '.github/workflows/p5-screw-pile-golden.yml',
            'docs/P5_6_SCREW_PILE_PROMOTION_EVIDENCE.md',
          ]
          rp=Path('RELEASE_SYNC_MANIFEST.json')
          rm=json.loads(rp.read_text(encoding='utf-8'))
          for f in tracked: rm['files'][f]=norm_hash(f)
          rp.write_text(json.dumps(rm,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')

          # 3) Full-overwrite manifest mirrors release-bound files and the final release manifest.
          fp=Path('FULL_OVERWRITE_MANIFEST.json')
          fm=json.loads(fp.read_text(encoding='utf-8'))
          for f in tracked: fm['files'][f]=norm_hash(f)
          fm['files']['RELEASE_SYNC_MANIFEST.json']=norm_hash('RELEASE_SYNC_MANIFEST.json')
          fm['fileCount']=len(fm['files'])
          fp.write_text(json.dumps(fm,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')

          print('router raw',router)
          print('source-sync normalized',norm_hash('tools/pass83-source-sync-gate.mjs'))
          print('release manifest normalized',norm_hash('RELEASE_SYNC_MANIFEST.json'))
          print('full fileCount',fm['fileCount'])
      - name: Validate release/source sync immediately
        run: |
          node tools/pass83-source-sync-gate.mjs
          node tools/release-sync-gate.mjs
      - name: Commit synchronized manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pass83-source-sync-gate.mjs RELEASE_SYNC_MANIFEST.json FULL_OVERWRITE_MANIFEST.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(p5.6): synchronize release and source fingerprints"
          git push origin HEAD:p5/screw-pile-promotion
