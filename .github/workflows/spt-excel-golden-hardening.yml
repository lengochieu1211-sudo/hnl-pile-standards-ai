name: HNL SPT Excel Golden Hardening
on:
  push:
    branches: [repair/spt-excel-golden-hardening]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-excel-context-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Apply explicit sourceInput repair
        run: node scripts/repair-spt-excel-context-v2.mjs
      - name: Focused SPT regression
        run: node --test tests/spt-excel-golden-hardening.test.mjs
      - name: Search/P4 safety locks
        run: |
          npm run check:search
          node -e "const fs=require('fs');const s=fs.readFileSync('src/p4-pdf-excel-intelligence.js','utf8');if(!s.includes(\"P4_PROMOTION_STATE = 'SHADOW_ONLY'\"))throw Error('P4 drift')"
      - name: Commit only repaired adapter
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/excel-export-compat.js
          if git diff --cached --quiet; then echo 'No Excel context repair diff'; exit 1; fi
          git commit -m "fix(spt): pass explicit geometry context to Excel"
          git push origin HEAD:repair/spt-excel-golden-hardening
