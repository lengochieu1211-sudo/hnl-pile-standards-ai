name: TEMP · Prepare HNL v1.27.0 Release Tree

on:
  push:
    branches:
      - temp/v127-release-prep-20260829
    paths:
      - '.github/workflows/v127-release-prepare.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: temp/v127-release-prep-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Prepare controlled v1.27.0 release tree
        run: |
          node scripts/prepare-v127-release.mjs
          node scripts/fix-v127-workflow-release.mjs
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Certify prepared release metadata
        run: |
          npm run check:version
          npm run gate:release-sync
          npm run check:search
          node --check src/p4-pdf-excel-intelligence.js
          node --check src/pdf-excel-intelligence/core.js
          node --check src/pdf-excel-intelligence/adapters.js
          node --check src/pdf-excel-intelligence/exporter.js
          node --check src/pdf-excel-intelligence/ui.js
      - name: Commit and push prepared non-workflow files
        shell: pwsh
        run: |
          git config user.name "HNL Release Bot"
          git config user.email "actions@users.noreply.github.com"
          $files = @(git diff --name-only --diff-filter=ACM HEAD | Where-Object { -not $_.StartsWith('.github/workflows/') -and $_ -notin @('scripts/prepare-v127-release.mjs','scripts/fix-v127-workflow-release.mjs') })
          if (Test-Path 'docs/RELEASE_V1.27.0.md') { $files += 'docs/RELEASE_V1.27.0.md' }
          $files = $files | Sort-Object -Unique
          foreach ($file in $files) { git add -- $file }
          git status --short
          git commit -m "release: stage corrected HNL v1.27.0 non-workflow tree"
          git push origin HEAD:temp/v127-release-prep-20260829
