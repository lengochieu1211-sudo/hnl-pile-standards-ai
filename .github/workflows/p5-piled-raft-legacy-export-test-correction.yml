name: P5.8 Legacy Method-Only Export Test Correction

on:
  push:
    branches: [p5/piled-raft-method-gate]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-legacy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: p5/piled-raft-method-gate
          fetch-depth: 0
      - name: Correct obsolete method-only export assertion
        shell: python
        run: |
          from pathlib import Path
          p=Path('tests/v1.25.7.test.mjs')
          s=p.read_text(encoding='utf-8')
          old="  assert.equal(complete.canExport,true);"
          new="  // P5.8: VERIFIED_METHOD/methodOnly is a procedure/applicability result, never a final Production numeric workbook.\n  assert.equal(complete.canExport,false);"
          if old in s:
            s=s.replace(old,new,1)
          elif new not in s:
            raise SystemExit('legacy assertion anchor missing')
          p.write_text(s,encoding='utf-8',newline='\n')
      - name: Commit corrected regression contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/v1.25.7.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test(p5.8): block method-only Production Excel export"
          git push origin HEAD:p5/piled-raft-method-gate
