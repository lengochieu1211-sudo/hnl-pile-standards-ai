name: P5 Static Load Bootstrap
on:
  push:
    branches: [ 'p5/static-load-promotion' ]
permissions:
  contents: write
jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply P5.3 patch, run gates, commit final tree
        run: node scripts/p5-static-bootstrap.mjs
