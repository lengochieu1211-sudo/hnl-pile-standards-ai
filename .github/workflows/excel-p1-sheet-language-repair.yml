name: Excel P1 Sheet Language Repair

on:
  push:
    branches:
      - repair/post-merge-excel-audit-p1
    paths:
      - scripts/repair-excel-p1-sheet-language.mjs
      - .github/workflows/excel-p1-sheet-language-repair.yml

permissions:
  contents: write

jobs:
  repair-and-certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Apply deterministic sheet-language patch
        run: node scripts/repair-excel-p1-sheet-language.mjs
      - name: Source syntax and immutable Search Brain
        run: |
          node --check src/excel-export.js
          npm run check:search
      - name: Master Audit P0 and sheet-language proof
        shell: bash
        run: |
          node scripts/master-system-audit.mjs --enforce-p0
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('artifacts/master-system-audit/HNL_MASTER_CERTIFICATION_v1.26.0.json','utf8'));
          const row=j.gaps.find(x=>x.id==='EXCEL:SHEET_LANGUAGE');
          if(!row || row.status!=='PASS') throw new Error(`EXCEL:SHEET_LANGUAGE not PASS: ${JSON.stringify(row)}`);
          if(j.summary.openP0!==0) throw new Error(`Unexpected P0 gap: ${JSON.stringify(j.summary)}`);
          console.log('SHEET LANGUAGE GATE PASS',j.summary);
          NODE
      - name: Full regression
        run: npm test
      - name: Full Table Golden
        run: npm run golden:tables
      - name: Workflow Golden
        run: npm run golden:workflows
      - name: Material Golden
        run: npm run golden:material
      - name: DCE UDF Behavioral Golden
        run: npm run golden:dce-udf
      - name: SPT PDF Decision Golden
        run: npm run golden:spt-decision
      - name: Material E2E Golden
        run: npm run golden:material-e2e
      - name: Multi-Borehole Golden
        run: npm run golden:multiborehole
      - name: Excel runtime smoke
        run: npm run excel:smoke
      - name: Excel production smoke
        run: npm run excel:production-smoke
      - name: Build Web
        run: npm run build:web
      - name: Refresh certified excel-export source lock
        run: |
          node scripts/repair-excel-p1-sheet-language.mjs --refresh-lock
          npm run gate:pass83-source-sync
          npm run gate:pass83-tests
          npm run gate:release-sync
      - name: Commit only certified repair files
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/excel-export.js tools/pass83-source-sync-gate.mjs
          if git diff --cached --quiet; then
            echo "No certified repair changes to commit."
            exit 0
          fi
          git commit -m "fix(excel-p1): localize user-facing sheet names"
          git push origin HEAD:repair/post-merge-excel-audit-p1
