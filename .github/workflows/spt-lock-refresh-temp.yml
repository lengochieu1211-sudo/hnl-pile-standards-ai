name: HNL SPT Lock Refresh TEMP
on:
  push:
    branches: [repair/spt-excel-golden-hardening]
permissions:
  contents: write
jobs:
  refresh-locks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Refresh controlled SPT release hashes
        run: node scripts/refresh-spt-hardening-locks.mjs
      - name: Verify focused SPT tests
        run: node --test tests/spt-excel-golden-hardening.test.mjs tests/spt-excel-parity-provenance.test.mjs
      - name: Verify release/source locks after refresh
        run: |
          npm run gate:release-sync
          npm run gate:pass83-source-sync
          npm run check:search
      - name: Commit only lock files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE_SYNC_MANIFEST.json FULL_OVERWRITE_MANIFEST.json tools/pass83-source-sync-gate.mjs
          if git diff --cached --quiet; then echo 'No lock refresh diff'; exit 1; fi
          git commit -m "chore(spt): refresh certified source and release locks"
          git push origin HEAD:repair/spt-excel-golden-hardening
