name: P5.8 Bootstrap Router Fix

on:
  push:
    branches: [p5/piled-raft-method-gate]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: p5/piled-raft-method-gate
          fetch-depth: 0
      - name: Add piled-raft routing precedence patch to v2 bootstrap
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/p5-piled-raft-bootstrap-v2.yml')
          s=p.read_text(encoding='utf-8')
          anchor="          p.write_text(s,encoding='utf-8',newline='\\n')\n\n          p=Path('src/production-status-registry.js')"
          insert="""          # Piled-raft context must win over end-bearing when the same question says cọc tựa đá.\n          s=s.replace(\"'7888-material','10304-end-bearing','10304-cpt'\",\"'7888-material','10304-piled-raft','10304-end-bearing','10304-cpt'\",1)\n          s=s.replace(\"'10304-equivalent-block','10304-piled-raft','10304-construction-effect'\",\"'10304-equivalent-block','10304-construction-effect'\",1)\n          p.write_text(s,encoding='utf-8',newline='\\n')\n\n          p=Path('src/production-status-registry.js')"""
          if 'Piled-raft context must win over end-bearing' not in s:
            if anchor not in s: raise SystemExit('router bootstrap anchor missing')
            s=s.replace(anchor,insert,1)
          p.write_text(s,encoding='utf-8',newline='\n')
      - name: Commit bootstrap fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/p5-piled-raft-bootstrap-v2.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(p5.8): prioritize piled-raft context before end-bearing"
          git push origin HEAD:p5/piled-raft-method-gate
