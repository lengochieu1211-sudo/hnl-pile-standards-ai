    <meta name="description" content="HNL Pile Standards AI - đọc PDF/Word/Excel/ZIP/thư mục/hình ảnh, hỏi đáp AI offline/online và tra cứu tiêu chuẩn cọc." />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./hnl-mark-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./hnl-mark-64.png" />

    <title>HNL Pile Standards AI</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Compatibility for Windows/Electron/browser engines that do not yet expose
      // the new Map upsert proposal used by recent PDF.js builds. The PDF reader
      // also imports PDF.js legacy bundles, so both main thread and worker stay safe.
      (() => {
        const install = (Proto) => {
          if (!Proto || typeof Proto.getOrInsertComputed === 'function') return;
          Object.defineProperty(Proto, 'getOrInsertComputed', {
            configurable: true, writable: true,
            value(key, callback) {
              if (this.has(key)) return this.get(key);
              const value = callback(key);
              this.set(key, value);
              return value;
            }
          });
        };
        install(Map.prototype);
        if (typeof WeakMap !== 'undefined') install(WeakMap.prototype);
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
    <!-- Document Ingest v2: keeps the core main.js renderer untouched while
         exposing DOCX + XLSX/XLSM in every re-rendered source picker. -->
    <script type="module" src="/src/document-input-ui.js"></script>
    <!-- v1.27 research only: observes the real region-selection UI without
         replacing v1.26 Production behavior. Remove/disable with ?pdfshadow=off. -->
    <script type="module" src="/src/pdf-intelligence/region-shadow-ui.js"></script>
    <!-- v1.27 P3.2 research harness: hidden by default; Ctrl+Shift+G or ?pdfgolden=1.
         Records real-PDF evidence only and never mutates Production state. -->
    <script type="module" src="/src/pdf-intelligence/real-pdf-golden-ui.js"></script>
    <!-- v1.27 P4 research/shadow: isolated PDF region/text → Excel adapter. -->
    <script type="module" src="/src/pdf-excel-intelligence/ui.js"></script>
    <!-- P4 Runtime Golden: observer-only harness; Ctrl+Shift+X or ?p4golden=1.
         It records real user actions and never sends OCR/Vision by itself. -->
    <script type="module" src="/src/pdf-excel-intelligence/runtime-golden-ui.js"></script>
    <!-- CI-only deterministic browser fixture helper; hard no-op unless ?p4ci=1. -->
    <script type="module" src="/src/pdf-excel-intelligence/runtime-golden-ci.js"></script>
  </body>
</html>
