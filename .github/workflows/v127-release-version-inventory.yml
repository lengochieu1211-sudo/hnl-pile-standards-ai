name: v1.27 Release Version Inventory
on:
  push:
    branches: [repair/v127-excel-compat-release]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inventory 1.26.0 references
        shell: bash
        run: |
          echo '=== FILES ==='
          git grep -l '1\.26\.0' || true
          echo '=== LINES ==='
          git grep -n '1\.26\.0' || true
