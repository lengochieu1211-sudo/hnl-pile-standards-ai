name: Excel Production & SPT Input Certification · HNL v1.27.0

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  excel-spt-linux:
    name: Linux · SPT Formula Guard + Excel Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Single-version identity gate
        run: npm run check:version
      - name: Release synchronization gate
        run: npm run gate:release-sync
      - name: SPT Formula Guard + AI Input Golden
        run: node tools/v26-spt-golden.mjs
      - name: Vietnamese Formula-Only Excel Golden
        run: node tools/v26-spt-excel-golden.mjs
      - name: Excel Production compatibility/UI smoke
        run: npm run excel:production-smoke
      - name: Locked regression suite · exact 574
        run: npm run gate:pass83-tests
      - name: Full Table Golden
        run: npm run golden:tables
      - name: SPT PDF decision Golden
        run: npm run golden:spt-decision
      - name: Master System Audit · P0 only
        run: node scripts/master-system-audit.mjs --enforce-p0
      - name: Build production web
        run: npm run build:web
      - name: Normalize evidence names
        shell: bash
        run: |
          mkdir -p artifacts/release-v1.27.0
          [ -f artifacts/v26/V26_SPT_GOLDEN_RESULT.json ] && cp artifacts/v26/V26_SPT_GOLDEN_RESULT.json artifacts/release-v1.27.0/SPT_GOLDEN_RESULT.json || true
          [ -f artifacts/v26/V26_SPT_EXCEL_GOLDEN_RESULT.json ] && cp artifacts/v26/V26_SPT_EXCEL_GOLDEN_RESULT.json artifacts/release-v1.27.0/SPT_EXCEL_GOLDEN_RESULT.json || true
          [ -f artifacts/v26/HNL_V26_SPT_FORMULA_GOLDEN.xlsx ] && cp artifacts/v26/HNL_V26_SPT_FORMULA_GOLDEN.xlsx artifacts/release-v1.27.0/HNL_SPT_FORMULA_GOLDEN.xlsx || true
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: hnl-v1.27.0-spt-excel-linux
          path: |
            public/release-meta.json
            artifacts/release-v1.27.0/**
            artifacts/master-system-audit/**
          if-no-files-found: warn
